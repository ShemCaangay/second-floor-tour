<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">

<title>Second Floor Tour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: full-bleed 3D canvas; glass control rails pinned to the screen edges; one welcome sheet on top. */
:root {
  color-scheme: dark;
  --ink: #0e1311;            /* night ground behind the canvas */
  --panel: rgba(18, 24, 22, 0.78);
  --panel-solid: #161d1a;
  --line: rgba(236, 241, 235, 0.14);
  --fg: #eef1ec;
  --muted: #a7b1ab;
  --accent: #e3b25e;         /* brass: the sunset light the tour is built around */
  --accent-ink: #1b1408;
  --warn: #f0c27a;
  --font-ui: "Archivo", "Segoe UI", system-ui, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 12px;
}
[hidden] { display: none !important; }
html, body { height: 100%; overflow: hidden; background: var(--ink); color: var(--fg); font-family: var(--font-ui); }
#stage { position: fixed; inset: 0; touch-action: none; }
#stage canvas { display: block; width: 100%; height: 100%; outline: none; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.glass { background: var(--panel); border: 1px solid var(--line); border-radius: var(--r); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }

/* top rail */
#top { position: fixed; z-index: 5; left: 0; right: 0; top: 0; display: flex; gap: 10px; align-items: flex-start; justify-content: space-between;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) max(12px, env(safe-area-inset-right, 0px)) 0 max(12px, env(safe-area-inset-left, 0px)); pointer-events: none; }
#top > * { pointer-events: auto; }
#brand { padding: 10px 14px; display: grid; gap: 2px; min-width: 0; }
#brand b { font-weight: 600; font-size: 15px; letter-spacing: 0.01em; }
#brand span { font-family: var(--font-data); font-size: 11px; color: var(--muted); letter-spacing: 0.04em; text-transform: uppercase; }
#tools { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 9px 14px; font-size: 13px; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); min-height: 40px; }
.btn:hover { border-color: rgba(236, 241, 235, 0.35); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn svg { width: 16px; height: 16px; flex: none; }
.seg { display: inline-flex; padding: 3px; gap: 2px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.seg button { border: 0; background: transparent; padding: 7px 12px; border-radius: 999px; font-size: 13px; color: var(--muted); min-height: 34px; }
.seg .short { display: none; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--ink); font-weight: 600; }

/* room name while walking */
#roomTag { position: fixed; z-index: 4; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 74px); padding: 6px 12px; border-radius: 999px; font-size: 12px; font-family: var(--font-data); letter-spacing: 0.06em; text-transform: uppercase; color: var(--fg); background: rgba(14, 19, 17, 0.55); border: 1px solid var(--line); pointer-events: none; transition: opacity .4s; white-space: nowrap; }

/* bottom rail */
#bottom { position: fixed; z-index: 5; left: 0; right: 0; bottom: 0; display: flex; gap: 10px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap;
  padding: 0 max(12px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 12px) max(12px, env(safe-area-inset-left, 0px)); pointer-events: none; }
#bottom > * { pointer-events: auto; }
#timeBox { padding: 10px 14px 12px; flex: 1 1 360px; max-width: 520px; min-width: 0; display: grid; gap: 6px; }
#timeBox .row { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
#timeBox label { font-size: 12px; color: var(--muted); }
#clock { font-family: var(--font-data); font-size: 13px; font-variant-numeric: tabular-nums; }
#time { width: 100%; accent-color: var(--accent); height: 28px; }
#ticks { display: flex; justify-content: space-between; font-family: var(--font-data); font-size: 10px; color: var(--muted); letter-spacing: 0.05em; text-transform: uppercase; }
#tourBtn { min-height: 48px; padding: 12px 20px; font-size: 15px; }

/* tour card */
#card { position: fixed; z-index: 6; left: max(12px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 112px); width: min(360px, calc(100vw - 24px)); padding: 14px 16px; display: grid; gap: 6px; transition: opacity .5s, transform .5s; }
#card[data-show="false"] { opacity: 0; transform: translateY(8px); pointer-events: none; }
#card .step { font-family: var(--font-data); font-size: 11px; color: var(--accent); letter-spacing: 0.08em; text-transform: uppercase; }
#card h2 { margin: 0; font-size: 22px; font-weight: 600; text-wrap: balance; }
#card .size { font-family: var(--font-data); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
#card p { margin: 2px 0 0; font-size: 14px; line-height: 1.45; }

/* minimap */
#mini { position: fixed; z-index: 5; right: max(12px, env(safe-area-inset-right, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 84px); padding: 8px; }
#mini canvas { display: block; width: 168px; height: 200px; cursor: crosshair; }
#mini small { display: block; margin-top: 4px; font-size: 10px; color: var(--muted); font-family: var(--font-data); text-align: center; }

/* hint + joystick */
#hint { position: fixed; z-index: 4; left: 50%; top: 50%; transform: translate(-50%, -50%); padding: 12px 16px; font-size: 13px; color: var(--fg); text-align: center; pointer-events: none; transition: opacity .6s; line-height: 1.5; max-width: calc(100vw - 32px); }
#hint kbd { font-family: var(--font-data); font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; }
#stick { position: fixed; z-index: 6; left: max(20px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 150px); width: 120px; height: 120px; border-radius: 50%; border: 1px solid var(--line); background: rgba(14, 19, 17, 0.35); touch-action: none; }
#stick i { position: absolute; left: 50%; top: 50%; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%; background: rgba(238, 241, 236, 0.85); }

/* sheets */
.sheet { position: fixed; z-index: 20; inset: 0; display: grid; place-items: center; padding: calc(env(safe-area-inset-top, 0px) + 16px) max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 16px) max(16px, env(safe-area-inset-left, 0px)); background: rgba(10, 14, 12, 0.45); overflow-y: auto; }
.sheet > div { width: min(560px, 100%); padding: 26px 26px 22px; display: grid; gap: 14px; background: var(--panel-solid); }
#welcome { background: linear-gradient(180deg, rgba(10,14,12,0.15), rgba(10,14,12,0.75)); }
#welcome .eyebrow { font-family: var(--font-data); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); }
#welcome h1 { margin: 0; font-size: clamp(30px, 6vw, 44px); font-weight: 700; line-height: 1.02; letter-spacing: -0.02em; text-wrap: balance; }
#welcome .sub { color: var(--muted); font-size: 15px; margin: 0; }
#welcome dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 0; font-size: 14px; }
#welcome dt { color: var(--muted); }
#welcome dd { margin: 0; font-variant-numeric: tabular-nums; }
#facts { display: flex; flex-wrap: wrap; gap: 8px; }
#facts span { font-family: var(--font-data); font-size: 12px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 999px; font-variant-numeric: tabular-nums; }
.note { font-size: 12px; color: var(--muted); line-height: 1.5; margin: 0; }
.note b { color: var(--warn); font-weight: 600; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; }
#info ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 14px; line-height: 1.45; }
#info h2, #contact h2 { margin: 0; font-size: 20px; }
#contact .num { font-family: var(--font-data); font-size: 20px; user-select: all; }
#loading { position: fixed; z-index: 30; inset: 0; display: grid; place-items: center; background: var(--ink); font-family: var(--font-data); font-size: 12px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }

@media (max-width: 640px) {
  #brand span { display: none; }
  #brand b { font-size: 13px; }
  .seg .long { display: none; } .seg .short { display: inline; }
  .seg button { padding: 7px 9px; }
  #top { flex-wrap: wrap; }
  #mini canvas { width: 112px; height: 134px; }
  #mini small { display: none; }
  #mini { bottom: calc(env(safe-area-inset-bottom, 0px) + 150px); }
  #card { bottom: calc(env(safe-area-inset-bottom, 0px) + 150px); width: calc(100vw - 150px); }
  #timeBox { flex-basis: 100%; max-width: none; }
  .btn .lbl { display: none; }
  .btn { padding: 9px 11px; }
  #tourBtn .lbl { display: inline; }
}
@media (prefers-reduced-motion: reduce) { #card, #hint, #roomTag { transition: none; } }
</style>

</head>
<body>
<div id="stage" aria-label="3D view of the second floor"></div>
<div id="loading">Building the floor…</div>

<header id="top">
  <div id="brand" class="glass"><b id="brandName">Second Floor</b><span id="brandSub">Draft · scaled from sheet A-01/00</span></div>
  <nav id="tools" aria-label="View controls">
    <div class="seg" role="group" aria-label="Interior style" id="styleSeg"></div>
    <button class="btn" id="viewBtn" type="button" aria-pressed="false" title="Switch between walking and the roof-off dollhouse view">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 10.5 12 4l9 6.5V20H3z"/><path d="M3 10.5h18"/></svg><span class="lbl" id="viewLbl">Dollhouse</span></button>
    <button class="btn" id="muteBtn" type="button" aria-pressed="false" title="Music on or off">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 9h4l5-4v14l-5-4H4z"/><path id="muteWave" d="M16.5 8.5a5 5 0 0 1 0 7"/><path id="muteX" d="m16 9 5 6m0-6-5 6"/></svg><span class="lbl" id="muteLbl">Music</span></button>
    <button class="btn" id="contactBtn" type="button" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg><span class="lbl">Contact</span></button>
    <button class="btn" id="infoBtn" type="button" title="About this model">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg><span class="lbl">About</span></button>
  </nav>
</header>

<div id="roomTag" style="opacity:0"></div>
<div id="hint" class="glass" style="opacity:0"></div>
<div id="stick" hidden><i></i></div>

<aside id="card" class="glass" data-show="false" aria-live="polite">
  <div class="step" id="cardStep"></div>
  <h2 id="cardName"></h2>
  <div class="size" id="cardSize"></div>
  <p id="cardText"></p>
</aside>

<div id="mini" class="glass"><canvas id="miniCanvas" width="336" height="400" aria-label="Floor plan with your position"></canvas><small>Tap a room to jump there</small></div>

<footer id="bottom">
  <div id="timeBox" class="glass">
    <div class="row"><label for="time">Time of day</label><span id="clock">10:00 AM</span></div>
    <input id="time" type="range" min="0" max="1000" step="1" value="267">
    <div id="ticks" aria-hidden="true"><span>Morning</span><span>Noon</span><span>Sunset</span><span>Night</span></div>
  </div>
  <button class="btn primary" id="tourBtn" type="button"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg><span class="lbl" id="tourLbl">Start Tour</span></button>
</footer>

<section class="sheet" id="welcome" aria-labelledby="wTitle">
  <div class="glass">
    <div class="eyebrow" id="wEyebrow">3D walkthrough</div>
    <h1 id="wTitle">Second Floor</h1>
    <p class="sub" id="wSub"></p>
    <dl id="wFacts"></dl>
    <div id="facts"></div>
    <p class="note" id="wNote"></p>
    <div class="actions">
      <button class="btn primary" id="startBtn" type="button">Start</button>
      <button class="btn" id="startTourBtn" type="button">Start with the guided tour</button>
    </div>
  </div>
</section>

<section class="sheet" id="info" hidden aria-labelledby="iTitle">
  <div class="glass">
    <h2 id="iTitle">About this model</h2>
    <ul id="infoList"></ul>
    <div class="actions"><button class="btn primary" type="button" data-close>Close</button></div>
  </div>
</section>

<section class="sheet" id="contact" hidden aria-labelledby="cTitle">
  <div class="glass">
    <h2 id="cTitle">Contact</h2>
    <div id="cName"></div>
    <div class="num" id="cPhone"></div>
    <div class="actions"><button class="btn" type="button" id="copyBtn">Copy number</button><a class="btn" id="callLink" href="#">Call</a><button class="btn primary" type="button" data-close>Close</button></div>
  </div>
</section>

function mergeGroup(group) {
  group.updateMatrixWorld(true);
  const buckets = new Map(), keep = [];
  group.traverse(o => {

    if (Array.isArray(o.material)) { keep.push(o); return; }
    if (artPieces.some(a => a.material === o.material)) { keep.push(o); return; }
    const key = o.material.uuid + (o.castShadow ? 's' : 'n');
    if (!buckets.has(key)) buckets.set(key, { m: o.material, cast: o.castShadow, geos: [] });
    let g = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone();
    for (const k of Object.keys(g.attributes)) if (!['position', 'normal', 'uv'].includes(k)) g.deleteAttribute(k);
    g.applyMatrix4(o.matrixWorld); buckets.get(key).geos.push(g);
  });
  const extra = [];
  group.traverse(o => { if (o.isInstancedMesh || keep.includes(o)) extra.push(o); });
  for (const o of extra) { o.updateMatrixWorld(true); const wm = o.matrixWorld.clone(); o.removeFromParent(); o.matrix.copy(wm); o.matrix.decompose(o.position, o.quaternion, o.scale); }
  group.clear(); group.position.set(0, 0, 0); group.rotation.set(0, 0, 0); group.scale.set(1, 1, 1);
  for (const { m, cast, geos } of buckets.values()) { const mm = new THREE.Mesh(mergeGeometries(geos), m); mm.castShadow = cast; mm.receiveShadow = true; group.add(mm); }
  for (const o of extra) group.add(o);
}
